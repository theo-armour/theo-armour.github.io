<script>/* src/loaders/csv.js */
// csv.js: CSV and TSV as a table (the first row is the header), with a Raw view.

const CsvLoader = {

  extensions: [ 'csv', 'tsv' ],
  toggle: () => true,
  maxRows: 2000,   // a bigger file shows its first rows and says so

  // Text → rows of cells. A quoted cell may hold the separator, line breaks, and "" for a quote.
  parse: ( text, separator = ',' ) => {
    const rows = [];
    let row = [];
    let cell = '';
    let quoted = false;
    for ( let i = 0; i < text.length; i += 1 ) {
      const c = text[ i ];
      if ( quoted && c === '"' && text[ i + 1 ] === '"' ) { cell += '"'; i += 1; }
      else if ( quoted && c === '"' ) { quoted = false; }
      else if ( quoted ) { cell += c; }
      else if ( c === '"' && cell === '' ) { quoted = true; }
      else if ( c === separator ) { row.push( cell ); cell = ''; }
      else if ( c === '\n' ) { row.push( cell ); rows.push( row ); row = []; cell = ''; }
      else if ( c !== '\r' ) { cell += c; }
    }
    if ( cell || row.length ) { row.push( cell ); rows.push( row ); }
    return rows;
  },

  render: async ( file, element ) => {
    const rows = CsvLoader.parse( await file.source.readText( file.path ), file.ext === 'tsv' ? '\t' : ',' );
    const esc = Shell.escape;
    const cells = ( row, tag ) => row.map( ( cell ) => `<${ tag }>${ esc( cell ) }</${ tag }>` ).join( '' );
    const [ head = [], ...body ] = rows;
    const shown = body.slice( 0, CsvLoader.maxRows );
    const more = body.length > shown.length ? `<p class="message">Showing the first ${ shown.length.toLocaleString() } of ${ body.length.toLocaleString() } rows.</p>` : '';
    element.innerHTML = `<div class="table-view"><table>
      <thead><tr>${ cells( head, 'th' ) }</tr></thead>
      <tbody>${ shown.map( ( row ) => `<tr>${ cells( row, 'td' ) }</tr>` ).join( '' ) }</tbody>
    </table></div>${ more }`;
  },

};
</script>
<script>/* src/loaders/html.js */
// html.js: an HTML page, running in a frame, with a Raw view of its source.
//
// Where it can, the frame loads the real page, so its own scripts, styles and images work:
//   - on the repo's own Pages site, the published page;
//   - on file:// with a picked folder, the file beside this page, when it's the same file.
// Otherwise it gets a blob copy, where relative links and assets may not load. The blob copy
// is sandboxed, so it can't read this page's storage. The real page isn't: only open HTML you trust.
// A TooToo page is never previewed inside TooToo, so the app can't show itself forever.

const HtmlLoader = {

  extensions: [ 'html', 'htm' ],
  toggle: () => true,

  isTooToo: ( text ) => text.includes( 'TOOTOO_CONFIG' ),

  sandbox: 'allow-scripts allow-forms allow-popups',   // for a blob copy: everything but this page's storage

  // The published page, when this app runs on the repo's own <owner>.github.io site.
  pagesUrl: ( path ) => {
    const host = `${ state.owner.toLowerCase() }.github.io`;
    if ( ! state.source || state.source.name !== 'github' || location.hostname !== host ) { return ''; }
    if ( state.repo.toLowerCase() === host ) { return `${ location.origin }/${ Router.encodePath( path ) }`; }
    const first = location.pathname.split( '/' ).filter( Boolean )[ 0 ] || '';
    return first.toLowerCase() === state.repo.toLowerCase() ? `${ location.origin }/${ first }/${ Router.encodePath( path ) }` : '';
  },

  // On file://, the picked folder is often the folder this page sits in: use the real file if it matches.
  localUrl: async ( file ) => {
    if ( location.protocol !== 'file:' || file.source.name !== 'local' ) { return ''; }
    const url = new URL( Router.encodePath( file.path ), location.href ).href;
    try {
      const blob = await ( await fetch( url ) ).blob();
      return blob.size === file.size ? url : '';
    } catch ( error ) { return ''; }
  },

  render: async ( file, element ) => {
    const text = await file.source.readText( file.path );
    if ( HtmlLoader.isTooToo( text ) ) {
      element.innerHTML = '<p class="message">This is a TooToo page, so it isn\'t previewed inside TooToo. Use ↗ New tab, or Raw for its source.</p>';
      return;
    }
    const real = HtmlLoader.pagesUrl( file.path ) || await HtmlLoader.localUrl( file );
    const frame = document.createElement( 'iframe' );
    frame.className = 'html-view';
    frame.title = file.name;
    // A blob copy would run as this page's own site, able to read the saved GitHub token.
    // The sandbox (no allow-same-origin) keeps its scripts running but walled off.
    if ( ! real ) { frame.setAttribute( 'sandbox', HtmlLoader.sandbox ); }
    frame.src = real || Loaders.track( URL.createObjectURL( new Blob( [ text ], { type: 'text/html' } ) ) );
    element.replaceChildren( frame );
  },

};
</script>
<script>/* src/loaders/index.js */
// index.js: picks the loader for a file and runs it (SPEC.md §4).
// A loader is { extensions, library?, toggle?( ext ), render( file, element ) }:
//   library: pinned CDN URLs, loaded once per page, the first time a file needs them;
//   toggle: true when the type has a Raw view (shown by the code loader).
// An unknown type is shown as text, unless its first bytes say it's binary: then download.

const Loaders = {

  list: [ MarkdownLoader, CodeLoader, MediaLoader, PdfLoader, CsvLoader, HtmlLoader, TextLoader ],

  // Types with no preview: offered for download without being read first.
  binary: [ 'zip', 'gz', 'tgz', '7z', 'rar', 'exe', 'dll', 'msi', 'docx', 'xlsx', 'pptx', 'odt', 'ods', 'woff', 'woff2',
    'ttf', 'otf', 'eot', 'psd', 'ai', 'glb', 'stl', 'class', 'jar', 'pyc', 'wasm', 'sqlite', 'db' ],

  download: {
    extensions: [],
    render: ( file, element ) => {
      element.innerHTML = `<p class="message">No preview for ${ Shell.escape( file.name ) }. Use ⬇ Download above.</p>`;
    },
  },

  textLimit: 2000000,   // bytes: bigger text files are offered for download instead

  extOf: ( path ) => {
    const name = path.split( '/' ).pop();
    return name.includes( '.' ) ? name.split( '.' ).pop().toLowerCase() : '';
  },

  find: ( ext ) => Loaders.list.find( ( loader ) => loader.extensions.includes( ext ) ),

  canToggle: ( path ) => {
    const loader = Loaders.find( Loaders.extOf( path ) );
    return Boolean( loader && loader.toggle && loader.toggle( Loaders.extOf( path ) ) );
  },

  // Whether Copy makes sense: text types, and unknown types (which are usually text).
  isText: ( path ) => {
    const ext = Loaders.extOf( path );
    return ! Loaders.binary.includes( ext ) && ! [ MediaLoader, PdfLoader ].includes( Loaders.find( ext ) );
  },

  // ── Libraries: one <script> or <link> per URL per page ──

  loaded: new Map(),   // url → Promise

  loadLibrary: ( url ) => {
    if ( ! Loaders.loaded.has( url ) ) {
      Loaders.loaded.set( url, new Promise( ( resolve, reject ) => {
        const css = url.endsWith( '.css' );
        const tag = document.createElement( css ? 'link' : 'script' );
        if ( css ) { tag.rel = 'stylesheet'; tag.href = url; } else { tag.src = url; }
        tag.onload = resolve;
        tag.onerror = () => { Loaders.loaded.delete( url ); reject( new Error( `Could not load ${ url }` ) ); };
        document.head.append( tag );
      } ) );
    }
    return Loaders.loaded.get( url );
  },

  loadLibraries: ( urls = [] ) => Promise.all( urls.map( Loaders.loadLibrary ) ),

  // ── Paths and URLs ──

  isExternal: ( href ) => /^([a-z][a-z0-9+.-]*:|\/\/)/i.test( href ),   // https:, mailto:, data:, //host

  // 'docs/a.md' + '../img/x.png' → 'img/x.png'. '/x' starts at the repo root. '' if it leaves the repo.
  resolvePath: ( fromFile, href ) => {
    const parts = href.startsWith( '/' ) ? [] : fromFile.split( '/' ).slice( 0, -1 );
    for ( const part of href.split( '/' ) ) {
      if ( part === '..' && ! parts.length ) { return ''; }
      if ( part === '..' ) { parts.pop(); } else if ( part && part !== '.' ) { parts.push( Router.decode( part ) ); }
    }
    return parts.join( '/' );
  },

  // MIME types the browser needs to show a file inline (raw GitHub sends many as plain bytes).
  types: { svg: 'image/svg+xml', pdf: 'application/pdf', mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg',
    m4a: 'audio/mp4', flac: 'audio/flac', mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg', mov: 'video/quicktime' },

  urls: [],   // blob URLs made for the open file, freed when the next one opens
  track: ( url ) => { Loaders.urls.push( url ); return url; },

  // A URL for <img>, <video>, <iframe>: GitHub's own URL where it serves the right type, else a typed blob URL.
  urlFor: async ( source, path ) => {
    const type = Loaders.types[ Loaders.extOf( path ) ];
    if ( source.name === 'github' && ! type ) { return source.fileUrl( path ); }
    const blob = await source.readBlob( path );
    return Loaders.track( URL.createObjectURL( type ? new Blob( [ blob ], { type } ) : blob ) );
  },

  // ── Render ──

  // An unknown type: binary when its first 4 KB hold a zero byte.
  sniff: async ( file ) => {
    const start = await ( await file.source.readBlob( file.path ) ).slice( 0, 4096 ).arrayBuffer();
    return new Uint8Array( start ).includes( 0 ) ? Loaders.download : TextLoader;
  },

  // options: { raw: show the source, notice( text ): say what's happening meanwhile }
  render: async ( file, element, { raw = false, notice = () => {} } = {} ) => {
    Loaders.urls.splice( 0 ).forEach( ( url ) => URL.revokeObjectURL( url ) );
    const found = Loaders.find( file.ext ) || ( Loaders.binary.includes( file.ext ) ? Loaders.download : await Loaders.sniff( file ) );
    const loader = raw && found.toggle && found.toggle( file.ext ) ? CodeLoader : found;
    const readsText = [ MarkdownLoader, CodeLoader, CsvLoader, TextLoader ].includes( loader );
    if ( readsText && file.size > Loaders.textLimit ) {
      element.innerHTML = `<p class="message">${ Shell.escape( file.name ) } is too large to show here. Use ⬇ Download above.</p>`;
      return;
    }
    if ( loader.library ) {
      notice( 'Loading…' );
      await Loaders.loadLibraries( loader.library ).catch( () => {} );   // without it, code shows unhighlighted
    }
    await loader.render( file, element );
  },

};
</script>
<script>/* src/ui/shell.js */
// shell.js: the header, the footer, and the panels (About, GitHub token).
// Also the branding from CONFIG (theme color, heading font, icon, title) and the
// per-page preferences (dark mode, text size), saved in localStorage.

const Shell = {

  escape: ( text ) => String( text ).replace( /&/g, '&amp;' ).replace( /</g, '&lt;' )
    .replace( />/g, '&gt;' ).replace( /"/g, '&quot;' ),

  // ── Saved preferences, per page: '<storagePrefix>:<page path>:<name>'. Storage can be blocked. ──

  key: ( name ) => `${ CONFIG.storagePrefix }:${ location.pathname }:${ name }`,
  load: ( name ) => {
    try { return JSON.parse( localStorage.getItem( Shell.key( name ) ) ); } catch ( error ) { return null; }
  },
  save: ( name, value ) => {
    try { localStorage.setItem( Shell.key( name ), JSON.stringify( value ) ); } catch ( error ) { /* not saved */ }
  },

  // Where TooToo itself lives: About's "source and updates" link. Not a setting: an install's own repo is in the header.
  tootooUrl: 'https://github.com/pushme-pullyou/tootoo',

  // The build date assemble.ps1 stamps, e.g. '2026-11-23'. 'dev' when src/ runs unbuilt.
  built: () => ( document.querySelector( 'meta[name="tootoo-built"]' ) || {} ).content || 'dev',
  builtText: ( built ) => ( /^\d{4}-\d\d-\d\d$/.test( built ) ? ` · built ${ built }` : '' ),

  // The install's own description, else the one written in the page (TooToo's).
  description: ( own = CONFIG.description ) => own || ( document.querySelector( 'meta[name="description"]' ) || {} ).content || '',

  // ── Mount ──

  // elements: { header, footer, panel }. Returns the unmount function.
  mount: ( elements ) => {
    Shell.el = elements;
    Shell.applyBranding();
    elements.header.innerHTML = Shell.headerHtml();
    elements.header.addEventListener( 'click', Shell.onClick );
    elements.panel.addEventListener( 'click', Shell.onClick );
    document.addEventListener( 'keydown', Shell.onPanelKey );
    document.addEventListener( 'click', Shell.onOutsideClick );
    Events.on( 'repo-changed', Shell.showRepo );
    Events.on( 'file-selected', Shell.showTitle );
    Events.on( 'tree-loaded', Shell.showFooter );   // the License link needs the tree
    Shell.restorePrefs();
    Shell.showRepo();
    return () => {
      elements.header.removeEventListener( 'click', Shell.onClick );
      elements.panel.removeEventListener( 'click', Shell.onClick );
      document.removeEventListener( 'keydown', Shell.onPanelKey );
      document.removeEventListener( 'click', Shell.onOutsideClick );
      Events.off( 'repo-changed', Shell.showRepo );
      Events.off( 'file-selected', Shell.showTitle );
      Events.off( 'tree-loaded', Shell.showFooter );
    };
  },

  // The GitHub mark (Octicons, MIT), drawn in the text color: the icon when faviconFile isn't set.
  githubMark: `<svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`,

  // The title, left to right (SPEC §6 Header): icon → the repo on GitHub, owner → their home page,
  // repo → its Pages site, app name → back to the start, subtitle. The links are filled in by showRepo.
  headerHtml: () => {
    const esc = Shell.escape;
    const icon = CONFIG.faviconFile ? `<img class="brand-icon" src="${ esc( CONFIG.faviconFile ) }" alt="">` : Shell.githubMark;
    const home = CONFIG.homeUrl ? `<a class="button" href="${ esc( CONFIG.homeUrl ) }" title="Home">⌂</a>` : '';
    return `
      <button class="sidebar-toggle" type="button" title="Show or hide the files (Ctrl+B)" aria-label="Show or hide the files">☰</button>
      <a class="icon-link">${ icon }</a>
      <span class="repo-links"></span>
      <a class="brand" href="${ esc( location.pathname ) }" title="Back to the start"><span class="app-name">${ esc( CONFIG.appName ) }</span></a>
      <span class="subtitle">${ esc( CONFIG.subtitle ) }</span>
      <span class="header-actions">
        ${ home }
        <button type="button" data-action="theme" title="Dark mode" aria-label="Dark mode">🌓</button>
        <button type="button" data-action="smaller" title="Smaller text" aria-label="Smaller text">A−</button>
        <button type="button" data-action="larger" title="Larger text" aria-label="Larger text">A+</button>
        <button type="button" data-action="token" title="GitHub token" aria-label="GitHub token">⚙️</button>
        <button type="button" data-action="about" title="About" aria-label="About">?</button>
      </span>`;
  },

  // ── Branding from CONFIG ──

  // Set on <body>, so an explicit theme color also wins over the dark-mode colors.
  applyBranding: () => {
    const body = document.body.style;
    if ( CONFIG.themeColor ) { body.setProperty( '--color-accent', CONFIG.themeColor ); }
    if ( CONFIG.bodyFont ) {
      // Headings follow the text font unless the install names a heading font of its own.
      body.setProperty( '--font-body', CONFIG.bodyFont );
      body.setProperty( '--font-heading', CONFIG.bodyFont );
    }
    if ( CONFIG.headingFont ) { body.setProperty( '--font-heading', CONFIG.headingFont ); }
    const url = CONFIG.headingFontUrl;
    if ( url && /\.(woff2?|ttf|otf)([?#]|$)/i.test( url ) ) {
      // A font file: name it after the first family in headingFont.
      const family = ( CONFIG.headingFont || 'Heading' ).split( ',' )[ 0 ].trim().replace( /^["']|["']$/g, '' );
      const style = document.createElement( 'style' );
      style.textContent = `@font-face { font-family: "${ family }"; src: url("${ url }"); font-display: swap; }`;
      document.head.append( style );
    } else if ( url ) {
      document.head.insertAdjacentHTML( 'beforeend', `<link rel="stylesheet" href="${ Shell.escape( url ) }">` );
    }
    if ( CONFIG.faviconFile ) {
      document.head.insertAdjacentHTML( 'beforeend', `<link rel="icon" href="${ Shell.escape( CONFIG.faviconFile ) }">` );
    }
    document.head.insertAdjacentHTML( 'beforeend', Shell.robotsHtml() );
    const meta = document.querySelector( 'meta[name="description"]' );
    if ( meta && CONFIG.description ) { meta.content = CONFIG.description; }
    document.title = CONFIG.appName;
  },

  // noindex: true asks search engines not to list the site. Only crawlers that run scripts see it.
  robotsHtml: ( config = CONFIG ) => ( config.noindex ? '<meta name="robots" content="noindex">' : '' ),

  // CONFIG.links as links: [ { label, url } ]. An entry without both, or with a script address, is skipped.
  linksHtml: ( links = CONFIG.links ) => ( Array.isArray( links ) ? links : [] )
    .filter( ( link ) => link && link.label && link.url && ! /^\s*javascript:/i.test( link.url ) )
    .map( ( link ) => `<a href="${ Shell.escape( link.url ) }">${ Shell.escape( link.label ) }</a>` ).join( ' · ' ),

  showTitle: ( { path } ) => { document.title = `${ path.split( '/' ).pop() } · ${ CONFIG.appName }`; },

  // The three links for owner / repo. The owner's own site repo (<owner>.github.io) has no repo link.
  // Always the Pages addresses: checking whether a repo has Pages is for later.
  titleLinks: ( owner, repo ) => {
    if ( ! ( owner && repo ) ) { return { github: '', home: '', pages: '' }; }
    const home = `https://${ owner.toLowerCase() }.github.io/`;
    const isSiteRepo = repo.toLowerCase() === `${ owner.toLowerCase() }.github.io`;
    return {
      github: `https://github.com/${ encodeURIComponent( owner ) }/${ encodeURIComponent( repo ) }`,
      home,
      pages: isSiteRepo ? '' : `${ home }${ encodeURIComponent( repo ) }/`,
    };
  },

  // True when two names differ only in case, spaces or punctuation: 'TooToo Next' = 'tootoo-next'.
  sameName: ( a, b ) => {
    const plain = ( name ) => String( name || '' ).toLowerCase().replace( /[^a-z0-9]/g, '' );
    return plain( a ) !== '' && plain( a ) === plain( b );
  },

  // The header shows the app name only when the install names itself (not the default) and it isn't a repeat.
  showsAppName: ( ownName, shownName ) => Boolean( ownName ) && ! Shell.sameName( ownName, shownName ),

  // The icon's link, owner / repo links (a local folder without a repo: its name), then the footer.
  // The app name is left out when it only repeats the name just before it.
  showRepo: () => {
    const esc = Shell.escape;
    const header = Shell.el.header;
    const links = Shell.titleLinks( state.owner, state.repo );
    const iconLink = header.querySelector( '.icon-link' );
    if ( links.github ) {
      iconLink.href = links.github;
      iconLink.title = `${ state.owner }/${ state.repo } on GitHub`;
    } else {
      iconLink.removeAttribute( 'href' );   // no repo known: the icon links nowhere
      iconLink.removeAttribute( 'title' );
    }
    const local = ( state.source || {} ).name === 'local';
    let html = '';
    if ( links.home ) {
      html = `<a href="${ esc( links.home ) }">${ esc( state.owner ) }</a>`;
      if ( links.pages ) { html += ` / <a href="${ esc( links.pages ) }">${ esc( state.repo ) }</a>`; }
    } else if ( local ) {
      html = esc( state.source.folderName );
    }
    header.querySelector( '.repo-links' ).innerHTML = html;
    const shownName = links.pages ? state.repo : links.home ? state.owner : '';
    header.querySelector( '.brand' ).hidden = ! Shell.showsAppName( ( window.TOOTOO_CONFIG || {} ).appName, shownName );
    Shell.showFooter();
  },

  // The repo's license file at the top level (LICENSE, LICENSE.md, COPYING …), or ''.
  licensePath: ( items = state.tree || [] ) => ( items.find( ( item ) => item.type === 'file'
    && /^(licen[cs]e|copying)(\.\w+)?$/i.test( item.path ) ) || {} ).path || '',

  // '© 2026 owner · License' (plus rightsText when set), then CONFIG.links. Drawn again once the tree is known.
  showFooter: () => {
    const esc = Shell.escape;
    const license = Shell.licensePath();
    const rights = [ esc( Shell.rightsLine( state.owner ) ), license ? `<a href="#${ esc( Router.encodePath( license ) ) }">License</a>` : '' ];
    Shell.el.footer.innerHTML = `<span>${ rights.filter( Boolean ).join( ' · ' ) }</span><span class="footer-links">${ Shell.linksHtml() }</span>`;
  },

  // '© 2026 owner', plus ' · <rightsText>' when set. rightsOwners: null = every owner, a list = only those, [] = none.
  rightsLine: ( owner, config = CONFIG, year = new Date().getFullYear() ) => {
    if ( ! owner ) { return ''; }
    const owns = ! config.rightsOwners || config.rightsOwners.some( ( name ) => name.toLowerCase() === owner.toLowerCase() );
    return `© ${ year } ${ owner }${ config.rightsText && owns ? ` · ${ config.rightsText }` : '' }`;
  },

  // ── Preferences ──

  fontSize: 16,

  restorePrefs: () => {
    const dark = Shell.load( 'darkMode' );
    Shell.setDark( dark === null ? Shell.startsDark( CONFIG.darkMode, window.matchMedia( '(prefers-color-scheme: dark)' ).matches ) : dark, false );
    const size = Shell.load( 'fontSize' );
    if ( size ) { Shell.setFontSize( size, false ); }
  },

  // Before the reader has used 🌓: darkMode 'dark' or 'light' decides; anything else follows the device.
  startsDark: ( mode, deviceIsDark ) => mode === 'dark' || ( mode !== 'light' && deviceIsDark ),

  setDark: ( dark, save = true ) => {
    document.body.classList.toggle( 'dark-mode', dark );
    if ( save ) { Shell.save( 'darkMode', dark ); }
    Events.emit( 'theme-changed', { dark } );
  },

  setFontSize: ( size, save = true ) => {
    Shell.fontSize = Math.min( 24, Math.max( 12, size ) );
    document.body.style.setProperty( '--font-size', `${ Shell.fontSize }px` );
    if ( save ) { Shell.save( 'fontSize', Shell.fontSize ); }
  },

  onClick: ( event ) => {
    const button = event.target.closest( '[data-action]' );
    const action = button && button.dataset.action;
    if ( action === 'theme' ) { Shell.setDark( ! document.body.classList.contains( 'dark-mode' ) ); }
    if ( action === 'smaller' ) { Shell.setFontSize( Shell.fontSize - 1 ); }
    if ( action === 'larger' ) { Shell.setFontSize( Shell.fontSize + 1 ); }
    if ( action === 'about' || action === 'token' ) { Shell.togglePanel( action ); }
    if ( action === 'close' ) { Shell.closePanel(); }
    if ( action === 'save-token' || action === 'remove-token' ) {
      const input = Shell.el.panel.querySelector( '.token-input' );
      GitHub.setToken( action === 'save-token' ? input.value.trim() : '' );
      location.reload();   // start again with the new token
    }
  },

  // ── Panels: About and the GitHub token, as a pop-up over the page (SPEC §6 Pop-up panels) ──

  openPanel: ( name, reason = '' ) => {
    const panel = Shell.el.panel;
    panel.innerHTML = name === 'about' ? Shell.aboutHtml() : Shell.tokenHtml( reason );
    panel.dataset.open = name;
    panel.hidden = false;
    ( panel.querySelector( '.token-input' ) || panel.querySelector( '.panel-close' ) ).focus();
  },

  // Escape closes the pop-up, and so does a click outside it (the header's own buttons toggle it themselves).
  onPanelKey: ( event ) => { if ( event.key === 'Escape' && ! Shell.el.panel.hidden ) { Shell.closePanel(); } },
  onOutsideClick: ( event ) => {
    const { panel, header } = Shell.el;
    if ( ! panel.hidden && ! panel.contains( event.target ) && ! header.contains( event.target ) ) { Shell.closePanel(); }
  },

  closePanel: () => {
    Shell.el.panel.hidden = true;
    Shell.el.panel.dataset.open = '';
  },

  togglePanel: ( name ) => ( Shell.el.panel.dataset.open === name ? Shell.closePanel() : Shell.openPanel( name ) ),

  aboutHtml: () => {
    const esc = Shell.escape;
    const files = ( state.tree || [] ).filter( ( item ) => item.type === 'file' ).length;
    const source = state.source || {};
    const where = source.name === 'local' ? `the folder 📂 ${ esc( source.folderName ) }`
      : state.owner ? `<a href="https://github.com/${ esc( state.owner ) }/${ esc( state.repo ) }">${ esc( state.owner ) }/${ esc( state.repo ) }</a>${ state.branch ? ` (${ esc( state.branch ) })` : '' }`
        : 'no repository yet';
    const unknown = Config.unknownKeys();
    return `<button type="button" class="panel-close" data-action="close" aria-label="Close">✕</button>
      <h2>${ esc( CONFIG.appName ) }</h2>
      ${ CONFIG.subtitle ? `<p>${ esc( CONFIG.subtitle ) }</p>` : '' }
      ${ Shell.description() ? `<p class="about-description">${ esc( Shell.description() ) }</p>` : '' }
      <p>Showing ${ where }: ${ files.toLocaleString() } files.</p>
      <p>TooToo release <strong>${ esc( Update.release() ) }</strong>${ esc( Shell.builtText( Shell.built() ) ) } · <a href="${ Shell.tootooUrl }">source and updates</a></p>
      ${ Shell.linksHtml() ? `<p>Links: ${ Shell.linksHtml() }</p>` : '' }
      <p>Keys: <kbd>/</kbd> filter · <kbd>\\</kbd> tree · arrows move · <kbd>Ctrl</kbd>+<kbd>B</kbd> files</p>
      ${ unknown.length ? `<p>Settings this release ignores: ${ unknown.map( ( key ) => `<code>${ esc( key ) }</code>` ).join( ', ' ) }</p>` : '' }`;
  },

  tokenHtml: ( reason ) => `<button type="button" class="panel-close" data-action="close" aria-label="Close">✕</button>
    <h2>⚙️ GitHub token</h2>
    ${ reason ? `<p class="notice">${ Shell.escape( reason ) }</p>` : '' }
    <p>Without a token, GitHub allows 60 requests an hour. A token raises that to 5,000, and reads the private repos it has access to.
      It's saved in this browser only${ location.protocol === 'file:' ? ', where other local pages can read it too, so use a read-only token' : '' }.</p>
    <p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token on GitHub</a></p>
    <p><input type="password" class="token-input" autocomplete="off" aria-label="GitHub token"
      placeholder="${ GitHub.getToken() ? 'A token is saved. Paste a new one to replace it' : 'Paste a token' }">
      <button type="button" data-action="save-token" class="primary">Save</button>
      <button type="button" data-action="remove-token">Remove</button></p>`,

};
</script>
<script>/* src/ui/tree.js */
// tree.js: the sidebar file tree, from state.tree.
//
// Order: folders, then README files, then other files, A to Z. A folder named "blog" with
// month folders ("06-June") is a blog: months and years newest first, posts
// ("2026-06-28-title.md") newest first, and opening it opens the latest post.
// Rows are plain '#path' links, so clicks, keys and deep links all open files the same way.

const Tree = {

  // ── What shows (pure, tested) ──

  readme: /^readme/i,
  // A date AFTER a name marks a backup ("index-2026-10-24.html", "README 2026 09 18.md");
  // a date at the START is content ("2026-01-04-essay.md").
  datedBackup: /^.+20\d\d[-_ .]\d\d/,

  isVisible: ( item, config = CONFIG ) => {
    const parts = item.path.split( '/' );
    if ( parts.some( ( part ) => part.startsWith( '.' ) ) ) { return false; }   // dotfolders and dotfiles
    const lower = ( list ) => list.map( ( name ) => name.toLowerCase() );
    const folders = item.type === 'folder' ? parts : parts.slice( 0, -1 );
    if ( folders.some( ( part ) => lower( config.hiddenFolders ).includes( part.toLowerCase() ) ) ) { return false; }
    if ( item.type === 'folder' ) { return true; }
    const name = parts[ parts.length - 1 ].toLowerCase();
    if ( name === 'index.bak' ) { return false; }   // always hidden (SPEC.md §5)
    if ( config.hideDatedBackups && Tree.datedBackup.test( name ) ) { return false; }
    // A hiddenFiles name hides that file at any depth; '/name' hides it only at the root.
    const files = lower( config.hiddenFiles );
    return ! files.includes( name ) && ! files.includes( `/${ item.path.toLowerCase() }` );
  },

  monthOf: ( name ) => Number( ( name.match( /^(\d{2})-/ ) || [] )[ 1 ] || 0 ),       // '06-June' → 6
  yearOf: ( name ) => Number( ( name.match( /^(\d{4})$/ ) || [] )[ 1 ] || 0 ),         // '2025' → 2025
  dateOf: ( name ) => ( name.match( /^\d{4}-\d{2}-\d{2}/ ) || [] )[ 0 ] || '',         // '2026-06-28-title.md'

  // [ group, key ]: lower comes first. `mode` is '' (normal), 'blog', 'year', 'month' or 'inside' a blog.
  rank: ( node, mode ) => {
    const folder = node.type === 'folder';
    if ( folder && ( mode === 'blog' || mode === 'year' ) && Tree.monthOf( node.name ) ) { return [ 0, -Tree.monthOf( node.name ) ]; }
    if ( folder && mode === 'blog' && Tree.yearOf( node.name ) ) { return [ 1, -Tree.yearOf( node.name ) ]; }
    if ( ! folder && mode === 'month' && Tree.dateOf( node.name ) ) { return [ 0, -Number( Tree.dateOf( node.name ).replace( /-/g, '' ) ) ]; }
    return [ folder ? 2 : Tree.readme.test( node.name ) ? 3 : 4, 0 ];
  },

  compare: ( a, b, mode ) => {
    const [ groupA, keyA ] = Tree.rank( a, mode );
    const [ groupB, keyB ] = Tree.rank( b, mode );
    return groupA - groupB || keyA - keyB || a.name.toLowerCase().localeCompare( b.name.toLowerCase() );
  },

  modeOf: ( folder, parentMode ) => {
    const hasMonths = folder.children.some( ( child ) => child.type === 'folder' && Tree.monthOf( child.name ) );
    if ( ! parentMode && folder.name.toLowerCase() === 'blog' && hasMonths ) { return 'blog'; }
    if ( ! parentMode ) { return ''; }
    if ( Tree.yearOf( folder.name ) ) { return 'year'; }
    return Tree.monthOf( folder.name ) ? 'month' : 'inside';
  },

  sortFolder: ( folder, mode ) => {
    folder.children.sort( ( a, b ) => Tree.compare( a, b, mode ) );
    for ( const child of folder.children.filter( ( node ) => node.type === 'folder' ) ) {
      child.mode = Tree.modeOf( child, mode );
      Tree.sortFolder( child, child.mode );
    }
  },

  // Flat items → sorted nodes: [ { name, path, type, size, children, mode } ].
  build: ( items, config = CONFIG ) => {
    const root = { children: [] };
    const folders = new Map( [ [ '', root ] ] );
    const parentOf = ( path ) => path.split( '/' ).slice( 0, -1 ).join( '/' );
    const folderAt = ( path ) => {
      if ( ! folders.has( path ) ) {
        const node = { name: path.split( '/' ).pop(), path, type: 'folder', children: [] };
        folders.set( path, node );
        folderAt( parentOf( path ) ).children.push( node );
      }
      return folders.get( path );
    };
    for ( const item of items.filter( ( entry ) => Tree.isVisible( entry, config ) ) ) {
      if ( item.type === 'folder' ) { folderAt( item.path ); } else {
        folderAt( parentOf( item.path ) ).children.push( { name: item.path.split( '/' ).pop(), path: item.path, type: 'file', size: item.size } );
      }
    }
    Tree.sortFolder( root, '' );
    return root.children;
  },

  // The newest dated post anywhere under a blog folder: its path, or ''.
  latestPost: ( folder ) => {
    const posts = [];
    const walk = ( node ) => node.children.forEach( ( child ) => ( child.type === 'folder' ? walk( child ) : Tree.dateOf( child.name ) && posts.push( child ) ) );
    walk( folder );
    posts.sort( ( a, b ) => Tree.dateOf( b.name ).localeCompare( Tree.dateOf( a.name ) ) || a.name.localeCompare( b.name ) );
    return posts.length ? posts[ 0 ].path : '';
  },

  // The README to open for a folder ('' = the root): the shortest visible README name.
  readmeIn: ( folder, items = state.tree || [] ) => items
    .filter( ( item ) => item.type === 'file' && Tree.isVisible( item ) && Tree.readme.test( item.path.split( '/' ).pop() )
      && item.path.split( '/' ).slice( 0, -1 ).join( '/' ) === folder )
    .map( ( item ) => item.path )
    .sort( ( a, b ) => a.length - b.length || a.localeCompare( b ) )[ 0 ] || '',

  // ── Rendering ──

  icons: { md: '📝', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
    mp3: '🎵', wav: '🎵', ogg: '🎵', mp4: '🎞️', webm: '🎞️', pdf: '📕', csv: '📊', html: '🌐', htm: '🌐' },
  iconFor: ( name ) => Tree.icons[ name.split( '.' ).pop().toLowerCase() ] || '📄',
  label: ( name ) => Shell.escape( name.replace( /-/g, ' ' ) ),   // hyphens read as spaces

  html: ( nodes ) => nodes.map( ( node ) => {
    const path = Shell.escape( node.path );
    if ( node.type === 'folder' ) {
      const blog = node.mode === 'blog' ? ` data-blog data-latest="${ Shell.escape( Tree.latestPost( node ) ) }"` : '';
      return `<details data-path="${ path }"${ blog }><summary class="tree-folder">📁 ${ Tree.label( node.name ) }</summary>${ Tree.html( node.children ) }</details>`;
    }
    const readme = Tree.readme.test( node.name ) ? ' readme' : '';
    return `<a class="tree-item${ readme }" href="#${ Shell.escape( Router.encodePath( node.path ) ) }" data-path="${ path }">${ Tree.iconFor( node.name ) } ${ Tree.label( node.name ) }</a>`;
  } ).join( '' ),

  render: () => {
    Tree.el.tree.innerHTML = Tree.html( Tree.build( state.tree ) );
    Tree.files = Tree.el.tree.querySelectorAll( '.tree-item' ).length;
    Tree.openBefore = null;
    Tree.runFilter();
  },

  go: ( path ) => { location.hash = `#${ Router.encodePath( path ) }`; },

  // Highlights the open file and opens the folders above it.
  markActive: ( { path } ) => {
    const old = Tree.el.tree.querySelector( '.tree-item.active' );
    if ( old ) { old.classList.remove( 'active' ); }
    const item = Tree.el.tree.querySelector( `.tree-item[data-path="${ CSS.escape( path ) }"]` );
    if ( ! item ) { return; }
    item.classList.add( 'active' );
    for ( let folder = item.closest( 'details' ); folder; folder = folder.parentElement.closest( 'details' ) ) {
      folder.dataset.seen = 'yes';   // opened by us, so no README auto-open
      folder.open = true;
    }
    item.scrollIntoView( { block: 'nearest' } );
    if ( Tree.isNarrow() ) { Tree.setCollapsed( true, false ); }
  },

  // The first time a folder is opened by hand: a blog opens its latest post, any other folder its README.
  onToggle: ( event ) => {
    const folder = event.target;
    if ( ! folder.open || folder.dataset.seen ) { return; }
    folder.dataset.seen = 'yes';
    const readme = folder.querySelector( ':scope > .tree-item.readme' );
    const target = folder.dataset.latest
      || ( CONFIG.autoOpenFolderReadme && ! folder.closest( '[data-blog]' ) && readme && readme.dataset.path );
    if ( target ) { Tree.go( target ); }
  },

  // ── Filter: matches file names; hyphens and spaces count as the same ──

  normalize: ( text ) => text.toLowerCase().replace( /[-\s]+/g, ' ' ).trim(),
  matches: ( name, query ) => Tree.normalize( name ).includes( Tree.normalize( query ) ),

  runFilter: () => {
    const { tree, filter, count } = Tree.el;
    const query = filter.value;
    const folders = [ ...tree.querySelectorAll( 'details' ) ];
    if ( ! Tree.normalize( query ) ) {
      tree.classList.remove( 'filtering' );
      tree.querySelectorAll( '.is-hidden' ).forEach( ( node ) => node.classList.remove( 'is-hidden' ) );
      if ( Tree.openBefore ) { folders.forEach( ( folder ) => { folder.open = Tree.openBefore.has( folder.dataset.path ); } ); }
      Tree.openBefore = null;
      count.textContent = `${ ( Tree.files || 0 ).toLocaleString() } files`;
      return;
    }
    Tree.openBefore = Tree.openBefore || new Set( folders.filter( ( folder ) => folder.open ).map( ( folder ) => folder.dataset.path ) );
    const items = [ ...tree.querySelectorAll( '.tree-item' ) ];
    const hits = new Set( items.filter( ( item ) => Tree.matches( item.dataset.path.split( '/' ).pop(), query ) ) );   // a Set: fast on big trees
    items.forEach( ( item ) => item.classList.toggle( 'is-hidden', ! hits.has( item ) ) );
    folders.reverse().forEach( ( folder ) => {
      const any = folder.querySelector( '.tree-item:not(.is-hidden)' );
      folder.classList.toggle( 'is-hidden', ! any );
      if ( any ) { folder.dataset.seen = 'yes'; folder.open = true; }
    } );
    tree.classList.add( 'filtering' );
    count.textContent = `${ hits.size } match${ hits.size === 1 ? '' : 'es' }`;
  },

  // ── Keyboard: / filter, \ tree, arrows, Home / End, Enter / Space, Ctrl+B ──

  // A row shows when it isn't filtered out and every folder above it is open.
  isShown: ( row ) => {
    if ( row.closest( '.is-hidden' ) ) { return false; }
    const start = row.tagName === 'SUMMARY' ? row.parentElement.parentElement : row;
    for ( let folder = start.closest( 'details' ); folder; folder = folder.parentElement.closest( 'details' ) ) {
      if ( ! folder.open ) { return false; }
    }
    return true;
  },

  rows: () => [ ...Tree.el.tree.querySelectorAll( 'summary, .tree-item' ) ].filter( Tree.isShown ),

  onKey: ( event ) => {
    const { tree, filter } = Tree.el;
    const active = document.activeElement;
    const typing = active && ( /^(INPUT|TEXTAREA|SELECT)$/.test( active.tagName ) || active.isContentEditable );
    const done = () => event.preventDefault();
    if ( ( event.ctrlKey || event.metaKey ) && ! event.altKey && event.key.toLowerCase() === 'b' ) { done(); Tree.toggle(); return; }
    if ( event.key === '/' && ! typing ) { done(); filter.focus(); return; }
    if ( event.key === '\\' && ( ! typing || active === filter ) ) {
      done();
      const current = tree.querySelector( '.tree-item.active' );
      const target = current && Tree.isShown( current ) ? current : Tree.rows()[ 0 ];
      if ( target ) { target.focus(); }
      return;
    }
    if ( ! tree.contains( active ) ) { return; }
    const rows = Tree.rows();
    const index = rows.indexOf( active );
    if ( index === -1 ) { return; }
    const folder = active.tagName === 'SUMMARY' ? active.parentElement : null;
    // Moving onto a file opens it, as today.
    const moveTo = ( row ) => { if ( row && row !== active ) { row.focus(); if ( row.dataset.path ) { Tree.go( row.dataset.path ); } } };
    const keys = {
      ArrowDown: () => moveTo( rows[ index + 1 ] ),
      ArrowUp: () => moveTo( rows[ index - 1 ] ),
      Home: () => moveTo( rows[ 0 ] ),
      End: () => moveTo( rows[ rows.length - 1 ] ),
      ArrowRight: () => { if ( folder && ! folder.open ) { folder.open = true; } else if ( folder ) { moveTo( rows[ index + 1 ] ); } },
      ArrowLeft: () => {
        if ( folder && folder.open ) { folder.open = false; return; }
        const parent = ( folder || active ).parentElement.closest( 'details' );
        if ( parent ) { parent.querySelector( ':scope > summary' ).focus(); }
      },
    };
    // Enter and Space on a folder are the browser's own <summary> toggle.
    if ( ! folder && ( event.key === 'Enter' || event.key === ' ' ) ) { done(); Tree.go( active.dataset.path ); return; }
    if ( keys[ event.key ] ) { done(); keys[ event.key ](); }
  },

  // ── Collapse and resize, saved per page. Narrow screens start collapsed. ──

  isNarrow: () => window.matchMedia( '(max-width: 700px)' ).matches,

  setCollapsed: ( collapsed, save = true ) => {
    Tree.el.root.classList.toggle( 'sidebar-hidden', collapsed );
    if ( save ) { Shell.save( 'sidebarHidden', collapsed ); }
  },

  toggle: () => Tree.setCollapsed( ! Tree.el.root.classList.contains( 'sidebar-hidden' ), ! Tree.isNarrow() ),

  startResize: ( event ) => {
    const resizer = event.target;
    resizer.setPointerCapture( event.pointerId );
    const move = ( e ) => Tree.el.root.style.setProperty( '--sidebar-width', `${ Math.min( window.innerWidth - 200, Math.max( 120, e.clientX ) ) }px` );
    const stop = () => {
      resizer.removeEventListener( 'pointermove', move );
      Shell.save( 'sidebarWidth', Tree.el.root.style.getPropertyValue( '--sidebar-width' ) );
    };
    resizer.addEventListener( 'pointermove', move );
    resizer.addEventListener( 'pointerup', stop, { once: true } );
  },

  // root: the view element holding .tree, .tree-filter, .tree-count, .resizer and .sidebar-toggle.
  mount: ( root ) => {
    const find = ( selector ) => root.querySelector( selector );
    Tree.el = { root, tree: find( '.tree' ), filter: find( '.tree-filter' ), count: find( '.tree-count' ) };
    const width = Shell.load( 'sidebarWidth' );
    if ( width ) { root.style.setProperty( '--sidebar-width', width ); }
    Tree.setCollapsed( Tree.isNarrow() || Shell.load( 'sidebarHidden' ) === true, false );
    Tree.el.tree.addEventListener( 'toggle', Tree.onToggle, true );   // 'toggle' doesn't bubble
    Tree.el.filter.addEventListener( 'input', Tree.runFilter );
    Tree.el.filter.addEventListener( 'keydown', ( event ) => { if ( event.key === 'Escape' ) { Tree.el.filter.value = ''; Tree.runFilter(); } } );
    find( '.resizer' ).addEventListener( 'pointerdown', Tree.startResize );
    find( '.sidebar-toggle' ).addEventListener( 'click', Tree.toggle );
    document.addEventListener( 'keydown', Tree.onKey );
    Events.on( 'tree-loaded', Tree.render );
    Events.on( 'file-selected', Tree.markActive );
    return () => {
      document.removeEventListener( 'keydown', Tree.onKey );
      Events.off( 'tree-loaded', Tree.render );
      Events.off( 'file-selected', Tree.markActive );
    };
  },

};
</script>
<script>/* src/ui/content.js */
// content.js: the open file. A header with breadcrumbs and actions (raw ↔ rendered, copy,
// new tab, download), then the file itself, drawn by Loaders.render.
// Owns state.currentPath. Emits file-selected, then file-rendered.

const Content = {

  ticket: 0,   // counts opens, so a slow file can't replace a newer one

  // element: the box for the file view. Returns the unmount function.
  mount: ( element ) => {
    element.innerHTML = `
      <div class="file-header" hidden>
        <nav class="breadcrumbs" aria-label="Path"></nav>
        <span class="file-actions">
          <button type="button" data-action="toggle" hidden></button>
          <button type="button" data-action="copy" title="Copy the text">📋 Copy</button>
          <button type="button" data-action="tab" title="Open in a new tab">↗ New tab</button>
          <button type="button" data-action="download" title="Download the file">⬇ Download</button>
        </span>
      </div>
      <article class="file-body"></article>`;
    const find = ( selector ) => element.querySelector( selector );
    Content.el = { element, header: find( '.file-header' ), crumbs: find( '.breadcrumbs' ), toggle: find( '[data-action=toggle]' ), body: find( '.file-body' ) };
    Content.el.header.addEventListener( 'click', Content.onAction );
    Events.on( 'open-requested', Content.onOpenRequested );
    return () => Events.off( 'open-requested', Content.onOpenRequested );
  },

  // The file the start opens: startFile when it names a file, or a folder with a README; else the root README.
  startPath: ( config = CONFIG, items = state.tree || [] ) => {
    const start = String( config.startFile || '' ).replace( /^\/+|\/+$/g, '' );
    const isFile = start && items.some( ( item ) => item.type === 'file' && item.path === start );
    return isFile ? start : ( start && Tree.readmeIn( start, items ) ) || Tree.readmeIn( '', items );
  },

  // An empty hash means the start (startPath). A heading in the open file just scrolls.
  onOpenRequested: ( { path, heading } ) => {
    if ( ! state.tree ) { return; }   // too early (e.g. the start panel is up): the view opens the deep link after the tree loads
    if ( path && path === state.currentPath && heading ) { Content.scrollTo( heading ); return; }
    Content.open( path || Content.startPath(), heading );
  },

  showMessage: ( text ) => {
    Content.ticket += 1;
    Content.el.header.hidden = true;
    Content.el.body.innerHTML = `<p class="message">${ Shell.escape( text ) }</p>`;
  },

  // Raw or rendered, remembered per file type.
  isRaw: ( path ) => Shell.load( `raw:${ Loaders.extOf( path ) }` ) === true,

  open: async ( path, heading = '' ) => {
    const item = ( state.tree || [] ).find( ( entry ) => entry.path === path && entry.type === 'file' );
    if ( ! item ) {
      Content.showMessage( path ? `Not found: ${ path }` : 'No README here. Choose a file from the list.' );
      return;
    }
    Content.ticket += 1;
    const ticket = Content.ticket;
    state.currentPath = path;
    Content.syncHash( path, heading );
    Events.emit( 'file-selected', { path } );
    Content.renderHeader( path );
    const { body } = Content.el;
    body.innerHTML = '<p class="message">Loading…</p>';

    // Drawn off-page, then swapped in, so a slower earlier file never lands on top.
    const fresh = document.createElement( 'div' );
    const file = { path, name: path.split( '/' ).pop(), ext: Loaders.extOf( path ), size: item.size, source: state.source };
    const notice = ( text ) => { if ( ticket === Content.ticket ) { body.innerHTML = `<p class="message">${ Shell.escape( text ) }</p>`; } };
    try {
      await Loaders.render( file, fresh, { raw: Content.isRaw( path ), notice } );
    } catch ( error ) {
      fresh.innerHTML = `<p class="message">Couldn't show ${ Shell.escape( path ) }: ${ Shell.escape( error.message ) }</p>`;
    }
    if ( ticket !== Content.ticket ) { return; }
    body.replaceChildren( ...fresh.childNodes );
    Content.scrollTo( heading );
    Events.emit( 'file-rendered', { path } );
  },

  // Keeps the address bar on the open file, without a new history entry or a hashchange.
  syncHash: ( path, heading ) => {
    const current = Router.current();
    if ( current.path !== path || current.heading !== heading ) {
      history.replaceState( null, '', Router.build( { ...current, path, heading } ) );
    }
  },

  scrollTo: ( heading ) => {
    const target = heading && Content.el.body.querySelector( `#${ CSS.escape( heading ) }` );
    if ( target ) { target.scrollIntoView(); } else { ( Content.el.element.closest( '.content' ) || Content.el.element ).scrollTop = 0; }
  },

  // The file's page on GitHub, or '' when no GitHub repo is known. No branch = HEAD, the default branch.
  githubUrl: ( owner, repo, branch, path ) => ( owner && repo
    ? `https://github.com/${ encodeURIComponent( owner ) }/${ encodeURIComponent( repo ) }/blob/${ Router.encodePath( branch || 'HEAD' ) }/${ Router.encodePath( path ) }`
    : '' ),

  // [GitHub mark] folder / … / file. A folder links to its own README when it has one.
  // No repo name first: the mark already leads to the repo, and the header names it.
  renderHeader: ( path ) => {
    const esc = Shell.escape;
    const github = Content.githubUrl( state.owner, state.repo, state.branch, path );
    const local = ( state.source || {} ).name === 'local';
    const mark = github ? `<a class="github-link" href="${ esc( github ) }" title="${ local ? 'On GitHub (may differ from your local copy)' : 'On GitHub' }">${ Shell.githubMark }</a> ` : '';
    const parts = path.split( '/' );
    const folders = parts.slice( 0, -1 ).map( ( part, i ) => {
      const readme = Tree.readmeIn( parts.slice( 0, i + 1 ).join( '/' ) );
      return readme ? `<a href="#${ esc( Router.encodePath( readme ) ) }">${ esc( part ) }</a>` : `<span>${ esc( part ) }</span>`;
    } );
    Content.el.crumbs.innerHTML = mark + [ ...folders, `<strong>${ esc( parts[ parts.length - 1 ] ) }</strong>` ].join( ' / ' );
    const { toggle } = Content.el;
    toggle.hidden = ! Loaders.canToggle( path );
    toggle.textContent = Content.isRaw( path ) ? '👁 Rendered' : '</> Raw';
    Content.el.header.querySelector( '[data-action=copy]' ).hidden = ! Loaders.isText( path );
    Content.el.header.hidden = false;
  },

  onAction: async ( event ) => {
    const button = event.target.closest( '[data-action]' );
    const path = state.currentPath;
    if ( ! button || ! path ) { return; }
    const action = button.dataset.action;
    try {
      if ( action === 'toggle' ) {
        Shell.save( `raw:${ Loaders.extOf( path ) }`, ! Content.isRaw( path ) );
        Content.open( path );
      }
      if ( action === 'copy' ) {
        await navigator.clipboard.writeText( await state.source.readText( path ) );
        button.textContent = '✔ Copied';
        setTimeout( () => { button.textContent = '📋 Copy'; }, 1500 );
      }
      if ( action === 'tab' ) { window.open( await state.source.fileUrl( path ), '_blank', 'noopener' ); }
      if ( action === 'download' ) {
        const link = document.createElement( 'a' );
        link.href = URL.createObjectURL( await state.source.readBlob( path ) );
        link.download = path.split( '/' ).pop();
        link.click();
        setTimeout( () => URL.revokeObjectURL( link.href ), 10000 );
      }
    } catch ( error ) {
      button.title = `Failed: ${ error.message }`;
    }
  },

};
</script>
<script>/* src/views/browser.js */
// browser.js: the Browser view (v1): the header, the file tree, the open file and the footer.
// It picks the source, loads the tree, and opens the deep link or the root README.

const BrowserView = {

  name: 'browser',

  // The ↑ that floats at the bottom of a scrolling panel (SPEC §6 Back to top).
  toTop: '<div class="to-top-holder"><button type="button" class="to-top" title="Back to top" aria-label="Back to top" hidden>↑</button></div>',

  layout: () => `
    <header class="app-header"></header>
    <div class="app-body">
      <nav class="sidebar" aria-label="Files">
        <div class="sidebar-top">
          <input class="tree-filter" type="search" placeholder="Filter files  ( / )" aria-label="Filter files">
          <span class="tree-count"></span>
        </div>
        <div class="tree"></div>
        ${ BrowserView.toTop }
      </nav>
      <div class="resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
      <main class="content">
        <section class="update-notice" hidden></section>
        <div class="file-view"></div>
        ${ BrowserView.toTop }
      </main>
    </div>
    <footer class="app-footer"></footer>
    <section class="panel" role="dialog" aria-label="About and the GitHub token" hidden></section>`,

  // The panel's ↑ shows once the panel has scrolled a little, and a click goes back to the top.
  addToTop: ( panel ) => {
    const button = panel.querySelector( ':scope > .to-top-holder > .to-top' );
    panel.addEventListener( 'scroll', () => { button.hidden = panel.scrollTop < 200; } );
    button.addEventListener( 'click', () => panel.scrollTo( { top: 0, behavior: 'smooth' } ) );
  },

  // options.source and options.repo skip the choice (the tests use the mock this way).
  mount: async ( element, options = {} ) => {
    const find = ( selector ) => element.querySelector( selector );
    element.classList.add( 'browser-view' );
    element.innerHTML = BrowserView.layout();
    BrowserView.element = element;
    [ find( '.sidebar' ), find( '.content' ) ].forEach( BrowserView.addToTop );
    state.tree = null;   // no files until this mount's source lists them
    BrowserView.unmounts = [
      Shell.mount( { header: find( '.app-header' ), footer: find( '.app-footer' ), panel: find( '.panel' ) } ),
      Tree.mount( element ),
      Content.mount( find( '.file-view' ) ),
      Update.mount( find( '.update-notice' ) ),
    ];
    // The start panel goes inside content's own body, so the first message after it replaces it
    // (drawn over the whole .file-view, it would wipe out content's header and body).
    const { source, repo } = options.source ? options : await BrowserView.chooseSource( find( '.file-body' ) );
    state.source = source;   // the view picks the source, so it owns state.source and state.tree
    Router.start( repo );
    await BrowserView.loadTree();
  },

  unmount: () => {
    BrowserView.unmounts.forEach( ( unmount ) => unmount() );
    BrowserView.element.innerHTML = '';
    BrowserView.element.classList.remove( 'browser-view', 'sidebar-hidden' );
  },

  // → { source, repo }. On file:// the start panel asks first (decision 32).
  chooseSource: async ( element ) => {
    // The one debug hook: src/index.html?source=mock. In the release build config.js is
    // inlined, so no script tag points to it, and the hook is ignored.
    const isSourcePage = Boolean( document.querySelector( 'script[src="core/config.js"]' ) );
    if ( isSourcePage && new URLSearchParams( location.search ).get( 'source' ) === 'mock' ) {
      await Loaders.loadLibrary( '../tests/mock-source.js' );
      return { source: MockSource, repo: { owner: 'mock', repo: 'mock-repo', branch: '' } };
    }
    if ( location.protocol === 'file:' ) {
      const choice = await Local.showStartPanel( element );
      if ( choice.choice === 'local' ) {
        return { source: choice.source, repo: ( await Local.readGitRepo( choice.source ) ) || { owner: '', repo: '', branch: '' } };
      }
      return { source: GitHub, repo: choice.repo || GitHub.detectRepo() };
    }
    return { source: GitHub, repo: GitHub.detectRepo() };
  },

  loadTree: async () => {
    if ( state.source === GitHub && ! ( state.owner && state.repo ) ) {
      Content.showMessage( 'No repository chosen. Set owner and repo in the config block, or add ?owner=…&repo=… to the address.' );
      return;
    }
    Content.showMessage( 'Loading files…' );
    try {
      state.tree = await state.source.listTree();
    } catch ( error ) {
      Content.showMessage( error.message );
      if ( error.needsToken ) { Shell.openPanel( 'token', error.message ); }
      return;
    }
    Events.emit( 'tree-loaded', { tree: state.tree } );
    const { path, heading } = Router.current();
    await Content.open( path || Content.startPath(), heading );
  },

};
</script>

<script>
// Startup: mount the one view there is. A setting to choose returns when a second view exists.
BrowserView.mount( document.getElementById( 'app' ) );
</script>

</body>
