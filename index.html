<script>/* src/core/config.js */
// config.js: the built-in defaults, merged with the page's config block (window.TOOTOO_CONFIG).
//
// - A missing key uses the default.
// - A key the app doesn't know is ignored. Config.unknownKeys() lists them, for About.
// - A key written twice in the block behaves as plain JavaScript: the last one wins.
// - CONFIG is frozen: nothing changes the settings while the app runs.

const Config = {

  defaults: Object.freeze( {
    owner: '', repo: '', branch: '', startFile: '',
    appName: 'TooToo', subtitle: '', description: '',
    themeColor: '', headingFontUrl: '', headingFont: '', bodyFont: '', darkMode: 'auto', faviconFile: '',
    homeUrl: '',
    storagePrefix: 'tootoo',
    hiddenFolders: Object.freeze( [] ), hiddenFiles: Object.freeze( [] ),   // the tree always hides index.bak
    hideDatedBackups: true, autoOpenFolderReadme: true,
    rightsText: '', rightsOwners: null, links: Object.freeze( [] ),
    noindex: false,
    checkForUpdates: true, updateUrl: 'https://pushme-pullyou.github.io/tootoo/releases/latest.json',
  } ),

  // True when the app has a setting by this name (own keys only, so 'toString' is unknown).
  isKnown: ( key ) => Object.hasOwn( Config.defaults, key ),

  // Defaults overlaid with the user's known keys. Arrays are copied, and everything is frozen.
  merge: ( user = {} ) => {
    const settings = { ...Config.defaults };
    for ( const [ key, value ] of Object.entries( user || {} ) ) {
      if ( Config.isKnown( key ) && value !== undefined ) { settings[ key ] = value; }
    }
    for ( const [ key, value ] of Object.entries( settings ) ) {
      if ( Array.isArray( value ) ) { settings[ key ] = Object.freeze( [ ...value ] ); }
    }
    return Object.freeze( settings );
  },

  // The keys in the user's block that the app ignores, e.g. retired 'faviconLetters'.
  unknownKeys: ( user = window.TOOTOO_CONFIG ) => Object.keys( user || {} ).filter( ( key ) => ! Config.isKnown( key ) ),

};

// The settings every part reads.
const CONFIG = Config.merge( window.TOOTOO_CONFIG );
</script>
<script>/* src/core/state.js */
// state.js: the one shared state object, plus a tiny on / off / emit.
//
// One writer per field. Only the owner changes a field; every other part reads it
// and listens for the owner's event.
//
//   Field                          Owner                        Event
//   owner, repo, branch            router.js / sources/*        repo-changed
//   source, tree                   the view (views/*), which picks the source and asks it for the tree
//                                                               tree-loaded
//   currentPath                    content.js                   file-selected, file-rendered
//   release, latest                update.js                    update-available
//
// Also: theme-changed (shell.js), and open-requested (router.js: the hash asks for a file;
// content.js opens it and then owns currentPath).

const state = {
  source: null,     // the active source: { listTree, readText, readBlob, fileUrl }
  owner: '',
  repo: '',
  branch: '',
  tree: null,       // [ { path, type: 'file' | 'folder', size } ]
  currentPath: '',
  release: '',      // this page's tootoo-release stamp
  latest: null,     // the newest release found by the update check
};

const Events = {

  // Every event name, so a typo throws instead of failing silently.
  names: [ 'repo-changed', 'tree-loaded', 'file-selected', 'file-rendered',
    'theme-changed', 'update-available', 'open-requested' ],

  listeners: {},    // event name → [ fn, … ] in the order they were added

  check: ( event ) => {
    if ( ! Events.names.includes( event ) ) { throw new Error( `Unknown event "${ event }"` ); }
  },

  on: ( event, fn ) => {
    Events.check( event );
    Events.listeners[ event ] = [ ...( Events.listeners[ event ] || [] ), fn ];
  },

  off: ( event, fn ) => {
    Events.check( event );
    Events.listeners[ event ] = ( Events.listeners[ event ] || [] ).filter( ( f ) => f !== fn );
  },

  // Calls each listener in order. One listener's error is logged and doesn't stop the rest.
  emit: ( event, detail ) => {
    Events.check( event );
    for ( const fn of Events.listeners[ event ] || [] ) {
      try { fn( detail ); } catch ( error ) { console.error( `"${ event }" listener failed:`, error ); }
    }
  },

};
</script>
<script>/* src/core/router.js */
// router.js: the address bar.
//
//   index.html?owner=theo-armour&repo=pages&branch=main#docs/read%20me.md#getting-started
//              └──────────── the repo (query) ────────┘ └─ file path ──┘ └─ heading ──┘
//
// Each path segment and the heading are percent-encoded, so a '#' inside a name
// (%23) never splits the hash. Other query params (e.g. ?source=mock) are kept.

const Router = {

  // decodeURIComponent, but a broken escape gives the raw text instead of throwing.
  decode: ( text ) => {
    try { return decodeURIComponent( text ); } catch ( error ) { return text; }
  },

  // 'docs/read me.md' → 'docs/read%20me.md': each segment encoded, slashes kept.
  encodePath: ( path ) => path.split( '/' ).map( encodeURIComponent ).join( '/' ),

  // A URL string → { owner, repo, branch, path, heading }, with '' for anything missing.
  parse: ( href ) => {
    const url = new URL( href );
    const get = ( name ) => url.searchParams.get( name ) || '';
    const hash = url.hash.slice( 1 );
    const split = hash.indexOf( '#' );
    const path = split === -1 ? hash : hash.slice( 0, split );
    const heading = split === -1 ? '' : hash.slice( split + 1 );
    return { owner: get( 'owner' ), repo: get( 'repo' ), branch: get( 'branch' ),
      path: Router.decode( path ), heading: Router.decode( heading ) };
  },

  // { owner, repo, branch, path, heading } → a URL string based on `base`.
  // Empty parts are left out.
  build: ( { owner = '', repo = '', branch = '', path = '', heading = '' }, base = location.href ) => {
    const url = new URL( base );
    for ( const [ name, value ] of Object.entries( { owner, repo, branch } ) ) {
      if ( value ) { url.searchParams.set( name, value ); } else { url.searchParams.delete( name ); }
    }
    const encodedPath = Router.encodePath( path );
    const fragment = heading ? `${ encodedPath }#${ encodeURIComponent( heading ) }` : encodedPath;
    // The hash setter drops one leading '#', so add it ourselves: '##top' keeps an empty path.
    url.hash = fragment ? `#${ fragment }` : '';
    return url.href;
  },

  // The address bar right now, parsed. Content reads this after the tree loads, for deep links.
  current: () => Router.parse( location.href ),

  // Writes the repo fields and tells everyone.
  setRepo: ( { owner = '', repo = '', branch = '' } ) => {
    state.owner = owner;
    state.repo = repo;
    state.branch = branch;
    Events.emit( 'repo-changed', { owner, repo, branch } );
  },

  // The hash changed (a link or the back button): ask content to open that file.
  onHashChange: () => {
    const { path, heading } = Router.current();
    Events.emit( 'open-requested', { path, heading } );
  },

  // Called once at startup with the detected repo, e.g. Router.start( GitHub.detectRepo() ).
  start: ( repo ) => {
    window.addEventListener( 'hashchange', Router.onHashChange );
    Router.setRepo( repo );
  },

};
</script>
<script>/* src/core/update.js */
// update.js: "rN available" (SPEC.md §5, decisions 3, 13, 16–19).
//
// The check: on a numbered release, for a likely maintainer (the page is opened via file://,
// or a GitHub token is saved), at most once a day, read CONFIG.updateUrl. The answer is
// remembered, so the notice shows all day without asking again. Failures are silent.
//
// The swap: fetch rN's index.html and put this page's own config block in place of rN's,
// markers included, as text: the block is never run or changed. Then offer the file as a download.
// Owns state.release and state.latest. Emits update-available.

const Update = {

  // Built from parts, so this file never holds a whole marker (assemble.ps1 checks for that).
  START: '<!-- TOOTOO-CONFIG-' + 'START',
  END: '<!-- TOOTOO-CONFIG-' + 'END -->',
  DAY: 24 * 60 * 60 * 1000,

  // ── Swappable for the tests ──
  storage: () => window.localStorage,
  request: ( url ) => fetch( url, { cache: 'no-cache' } ),
  clock: () => Date.now(),
  release: () => ( document.querySelector( 'meta[name="tootoo-release"]' ) || {} ).content || 'dev',
  save: ( blob, name ) => {
    const link = document.createElement( 'a' );
    link.href = URL.createObjectURL( blob );
    link.download = name;
    link.click();
    setTimeout( () => URL.revokeObjectURL( link.href ), 10000 );
  },

  // ── Releases ──

  number: ( release ) => Number( ( /^r(\d+)$/.exec( release || '' ) || [] )[ 1 ] || 0 ),   // 'r10' → 10; 'dev' → 0
  isNewer: ( latest, current ) => Update.number( latest ) > Update.number( current ),
  isMaintainer: ( protocol = location.protocol, token = GitHub.getToken() ) => protocol === 'file:' || Boolean( token ),
  isDue: ( checkedAt, now = Update.clock() ) => ! checkedAt || now - checkedAt >= Update.DAY,

  // { checkedAt, latest }, kept per browser.
  key: () => `${ CONFIG.storagePrefix }:update`,
  recall: () => {
    try { return JSON.parse( Update.storage().getItem( Update.key() ) ) || {}; } catch ( error ) { return {}; }
  },
  remember: ( memory ) => {
    try { Update.storage().setItem( Update.key(), JSON.stringify( memory ) ); } catch ( error ) { /* not remembered */ }
  },

  // latest.json → { release, date, url, notes }, or null if it isn't one.
  fetchLatest: async ( url ) => {
    const response = await Update.request( url );
    const latest = response.ok ? await response.json() : null;
    return latest && /^r\d+$/.test( latest.release ) && latest.url ? latest : null;
  },

  // Called once at startup. Resolves to the newer release, or null.
  check: async ( config = CONFIG ) => {
    state.release = Update.release();
    if ( ! config.checkForUpdates || ! Update.number( state.release ) || ! Update.isMaintainer() ) { return null; }
    const memory = Update.recall();
    const due = Update.isDue( memory.checkedAt );
    const latest = due ? await Update.fetchLatest( config.updateUrl ).catch( () => memory.latest || null ) : memory.latest;
    if ( due ) { Update.remember( { checkedAt: Update.clock(), latest } ); }
    if ( ! latest || ! Update.isNewer( latest.release, state.release ) ) { return null; }
    state.latest = latest;
    Events.emit( 'update-available', latest );
    return latest;
  },

  // ── The swap ──

  count: ( text, marker ) => text.split( marker ).length - 1,

  // Where the block is in `text`: { start, end, block }. Anything but one clean block is an error.
  blockOf: ( text, which ) => {
    const starts = Update.count( text, Update.START );
    const ends = Update.count( text, Update.END );
    if ( starts !== 1 || ends !== 1 ) {
      throw new Error( `${ which } needs each config marker exactly once; found START ${ starts } time(s) and END ${ ends } time(s).` );
    }
    const start = text.indexOf( Update.START );
    const end = text.indexOf( Update.END ) + Update.END.length;
    if ( end < start ) { throw new Error( `${ which }: the END marker comes before START.` ); }
    return { start, end, block: text.slice( start, end ) };
  },

  // The new release's text, with its block replaced by the page's own, byte for byte.
  swap: ( newText, ownText ) => {
    const fresh = Update.blockOf( newText, 'The new release' );
    const own = Update.blockOf( ownText, 'This page' );
    return newText.slice( 0, fresh.start ) + own.block + newText.slice( fresh.end );
  },

  // The page's block rebuilt from the DOM: its comments, the whitespace and the <script> between.
  // (The browser has already turned any CRLF into LF.)
  blockFromDom: ( doc = document ) => {
    const walker = doc.createTreeWalker( doc, NodeFilter.SHOW_COMMENT );
    const isStart = ( node ) => `<!--${ node.data }-->`.startsWith( Update.START );
    let start = walker.nextNode();
    while ( start && ! isStart( start ) ) { start = walker.nextNode(); }
    if ( ! start ) { return ''; }
    const parts = [];
    for ( let node = start; node; node = node.nextSibling ) {
      const html = node.nodeType === Node.COMMENT_NODE ? `<!--${ node.data }-->` : node.nodeType === Node.TEXT_NODE ? node.data : node.outerHTML;
      parts.push( html );
      if ( html === Update.END ) { break; }
    }
    return parts.join( '' );
  },

  // This page's own text: fetched, for exact bytes; or the block from the DOM when that's not allowed.
  ownSource: async () => {
    try {
      const text = await ( await fetch( location.href.split( '#' )[ 0 ] ) ).text();
      if ( text.includes( Update.START ) ) { return text; }
    } catch ( error ) { /* file:// without file access: use the DOM */ }
    return Update.blockFromDom();
  },

  download: async ( latest ) => {
    const response = await Update.request( latest.url );
    if ( ! response.ok ) { throw new Error( `${ latest.url } gave ${ response.status }` ); }
    const merged = Update.swap( await response.text(), await Update.ownSource() );
    Update.save( new Blob( [ merged ], { type: 'text/html' } ), 'index.html' );
  },

  // ── The notice ──

  noticeHtml: ( latest ) => {
    const esc = Shell.escape;
    const notes = latest.notes ? ` <a href="${ esc( latest.notes ) }" target="_blank" rel="noopener">What's new</a>` : '';
    return `<strong>TooToo ${ esc( latest.release ) } available</strong> (this page has ${ esc( state.release ) }).${ notes }
      <button type="button" class="primary" data-action="download-update">⬇ Download updated index.html</button>
      <button type="button" data-action="dismiss-update" aria-label="Close">✕</button>
      <span class="update-status" role="status"></span>`;
  },

  onClick: async ( event ) => {
    const button = event.target.closest( '[data-action]' );
    const notice = event.currentTarget;
    const status = notice.querySelector( '.update-status' );
    if ( button && button.dataset.action === 'dismiss-update' ) { notice.hidden = true; }
    if ( ! button || button.dataset.action !== 'download-update' ) { return; }
    status.textContent = 'Building it…';
    try {
      await Update.download( state.latest );
      status.textContent = 'Downloaded, with your settings. Rename your old index.html to index.bak, then put the new file in its place.';
    } catch ( error ) {
      status.innerHTML = `Couldn't build it here (${ Shell.escape( error.message ) }). Instead, download
        <a href="${ Shell.escape( state.latest.url ) }">${ Shell.escape( state.latest.release ) }</a> and copy your settings by hand:
        everything between the two TOOTOO-CONFIG marker lines.`;
    }
  },

  // element: where the notice shows. Starts the check. Returns the unmount function.
  mount: ( element ) => {
    const show = ( latest ) => {
      element.innerHTML = Update.noticeHtml( latest );
      element.hidden = false;
    };
    Events.on( 'update-available', show );
    element.addEventListener( 'click', Update.onClick );
    Update.check().catch( () => {} );
    return () => {
      Events.off( 'update-available', show );
      element.removeEventListener( 'click', Update.onClick );
    };
  },

};
</script>
<script>/* src/sources/github.js */
// github.js: the GitHub source. The four-function contract (SPEC.md §4) over the REST API,
// reading the repo from state.owner / repo / branch.
//
// Errors carry a `kind`, so the UI can say the right thing:
//   rate-limit, private, bad-token   → error.needsToken is true: open the token panel
//   missing-branch                   → the repo is readable, the branch isn't there
//   too-large                        → the tree is over GitHub's listing limit
//   not-found, http                  → a single file failed
//
// Without a token, files come from raw.githubusercontent.com (no API quota). With one,
// they come through the Contents API, which also serves private repos.

const GitHub = {

  name: 'github',

  messages: {
    'rate-limit': 'GitHub\'s limit of 60 requests an hour without a token is used up. Add a token for 5,000 an hour.',
    'bad-token': 'GitHub refused the saved token. Replace it or remove it.',
    private: 'Repository not found. Check the owner and repository names. If it\'s private, add a token with read access.',
    'missing-branch': 'Branch "{branch}" not found in {repo}.',
    'too-large': '{repo} is over GitHub\'s limit for one tree listing (100,000 files or 7 MB), so it can\'t be browsed here.',
  },

  // A clear error. `detail` fills the {branch} and {repo} blanks.
  errorFor: ( kind, message = GitHub.messages[ kind ], detail = {} ) => Object.assign(
    new Error( message.replace( /\{(\w+)\}/g, ( blank, name ) => detail[ name ] || '' ) ),
    { kind, needsToken: [ 'rate-limit', 'private', 'bad-token' ].includes( kind ) } ),

  // ── The token: optional, saved in this browser under storagePrefix ──

  storage: () => window.localStorage,   // tests swap in a fake
  tokenKey: () => `${ CONFIG.storagePrefix }:githubToken`,

  getToken: () => {
    try { return GitHub.storage().getItem( GitHub.tokenKey() ) || ''; } catch ( error ) { return ''; }
  },

  setToken: ( token ) => {
    try {
      if ( token ) { GitHub.storage().setItem( GitHub.tokenKey(), token ); } else { GitHub.storage().removeItem( GitHub.tokenKey() ); }
    } catch ( error ) { /* storage blocked: the token lasts until the page closes */ }
  },

  // ── Requests ──

  request: ( url, options ) => fetch( url, options ),   // tests swap in canned responses

  headers: () => {
    const token = GitHub.getToken();
    return token ? { Accept: 'application/vnd.github+json', Authorization: `token ${ token }` } : { Accept: 'application/vnd.github+json' };
  },

  // Passes an OK response through; anything else becomes a clear error.
  check: ( response, what ) => {
    if ( response.ok ) { return response; }
    if ( response.status === 401 ) { throw GitHub.errorFor( 'bad-token' ); }
    if ( response.status === 403 || response.status === 429 ) { throw GitHub.errorFor( 'rate-limit' ); }
    if ( response.status === 404 ) { throw GitHub.errorFor( 'not-found', `Not found: ${ what }` ); }
    throw GitHub.errorFor( 'http', `GitHub error ${ response.status } for ${ what }` );
  },

  repoName: () => `${ state.owner }/${ state.repo }`,
  apiUrl: ( rest = '' ) => `https://api.github.com/repos/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }${ rest }`,
  rawUrl: ( path ) => `https://raw.githubusercontent.com/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }/${ encodeURIComponent( state.branch ) }/${ Router.encodePath( path ) }`,

  api: async ( rest = '' ) => {
    const response = await GitHub.request( GitHub.apiUrl( rest ), { headers: GitHub.headers() } );
    return GitHub.check( response, GitHub.repoName() ).json();
  },

  // ── The four functions ──

  // The whole tree in one call. An empty branch is first set to the repo's default branch.
  listTree: async () => {
    const detail = { repo: GitHub.repoName(), branch: state.branch };
    try {
      if ( ! state.branch ) { state.branch = ( await GitHub.api() ).default_branch; }
      const data = await GitHub.api( `/git/trees/${ encodeURIComponent( state.branch ) }?recursive=1` );
      if ( data.truncated ) { throw GitHub.errorFor( 'too-large', undefined, detail ); }
      return data.tree
        .filter( ( item ) => item.type === 'blob' || item.type === 'tree' )   // skip submodules
        .map( ( item ) => ( { path: item.path, type: item.type === 'tree' ? 'folder' : 'file', size: item.size || 0 } ) );
    } catch ( error ) {
      if ( error.kind !== 'not-found' ) { throw error; }
      // A tree 404 means a missing or private repo, or only a bad branch in a readable repo.
      const readable = await GitHub.api().then( () => true, () => false );
      throw GitHub.errorFor( readable ? 'missing-branch' : 'private', undefined, detail );
    }
  },

  fetchFile: async ( path ) => {
    const token = GitHub.getToken();
    const response = token
      ? await GitHub.request( GitHub.apiUrl( `/contents/${ Router.encodePath( path ) }?ref=${ encodeURIComponent( state.branch ) }` ),
        { headers: { ...GitHub.headers(), Accept: 'application/vnd.github.raw+json' } } )
      : await GitHub.request( GitHub.rawUrl( path ) );
    return GitHub.check( response, path );
  },

  // Text is cached for the session: the last 50 files, per owner / repo / branch.
  cache: new Map(),

  readText: async ( path ) => {
    const key = `${ GitHub.repoName() }/${ state.branch }/${ path }`;
    if ( ! GitHub.cache.has( key ) ) {
      GitHub.cache.set( key, await ( await GitHub.fetchFile( path ) ).text() );
      if ( GitHub.cache.size > 50 ) { GitHub.cache.delete( GitHub.cache.keys().next().value ); }
    }
    return GitHub.cache.get( key );
  },

  readBlob: async ( path ) => ( await GitHub.fetchFile( path ) ).blob(),

  // A public raw URL, or with a token (maybe a private repo) a blob URL of the file.
  fileUrl: async ( path ) => GitHub.getToken() ? URL.createObjectURL( await GitHub.readBlob( path ) ) : GitHub.rawUrl( path ),

  // ── Which repo to show ──

  // ?owner=&repo= first, then CONFIG, then the *.github.io address it's served from.
  // ?branch= applies to any of them.
  detectRepo: ( href = location.href, config = CONFIG ) => {
    const url = new URL( href );
    const param = ( name ) => url.searchParams.get( name ) || '';
    const branch = param( 'branch' );
    if ( param( 'owner' ) && param( 'repo' ) ) { return { owner: param( 'owner' ), repo: param( 'repo' ), branch }; }
    if ( config.owner && config.repo ) { return { owner: config.owner, repo: config.repo, branch: branch || config.branch }; }
    if ( url.hostname.endsWith( '.github.io' ) ) {
      // theo-armour.github.io/pages/… → theo-armour/pages; the root site → theo-armour/theo-armour.github.io
      const owner = url.hostname.split( '.' )[ 0 ];
      const first = url.pathname.split( '/' ).filter( Boolean )[ 0 ] || '';
      return { owner, repo: first && ! /\.html?$/i.test( first ) ? first : url.hostname, branch };
    }
    return { owner: '', repo: '', branch: '' };
  },

};
</script>
<script>/* src/sources/local.js */
// local.js: the local source. The same four functions over a folder on disk (decision 10):
//   - the File System Access picker (Chrome, Edge), whose folder can be reopened next visit;
//   - or, when the picker is missing or fails, <input type="file" webkitdirectory>: same tree, no memory.
//
// Also the file:// start panel (decision 32): Reopen <folder> / Open folder / Browse GitHub instead.
// The folder handle and the choice are saved in IndexedDB, keyed by the page's path,
// because every file:// page shares one IndexedDB.

const Local = {

  // ── A source from a list of entries: path → { type, size, getFile } ──

  // .git is never shown in the tree; only .git/config and .git/HEAD are read, to find the repo.
  isGitPath: ( path ) => path === '.git' || path.startsWith( '.git/' ),

  makeSource: ( folderName, entries ) => {
    const fileAt = async ( path ) => {
      const entry = entries.get( path );
      if ( ! entry || entry.type !== 'file' ) { throw Object.assign( new Error( `Not found: ${ path }` ), { kind: 'not-found' } ); }
      return entry.getFile();
    };
    return {
      name: 'local',
      folderName,
      listTree: async () => [ ...entries ]
        .filter( ( [ path ] ) => ! Local.isGitPath( path ) )
        .map( ( [ path, entry ] ) => ( { path, type: entry.type, size: entry.size || 0 } ) ),
      readText: async ( path ) => ( await fileAt( path ) ).text(),
      readBlob: fileAt,   // a File is a Blob, with its type already set
      fileUrl: async ( path ) => URL.createObjectURL( await fileAt( path ) ),
    };
  },

  // Walks a folder handle. Inside .git it keeps only config and HEAD, and doesn't go deeper.
  walk: async ( folder, prefix, entries ) => {
    for await ( const handle of folder.values() ) {
      const path = prefix + handle.name;
      const inGit = prefix === '.git/';
      if ( handle.kind === 'directory' && ! inGit ) {
        entries.set( path, { type: 'folder' } );
        await Local.walk( handle, `${ path }/`, entries );
      } else if ( handle.kind === 'file' && ( ! inGit || [ 'config', 'HEAD' ].includes( handle.name ) ) ) {
        const file = await handle.getFile();
        entries.set( path, { type: 'file', size: file.size, getFile: () => handle.getFile() } );   // fresh on each read
      }
    }
    return entries;
  },

  fromHandle: async ( folder ) => Local.makeSource( folder.name, await Local.walk( folder, '', new Map() ) ),

  // From the upload input: each file's webkitRelativePath starts with the folder's own name.
  fromFiles: ( files ) => {
    const entries = new Map();
    let folderName = '';
    for ( const file of files ) {
      const [ top, ...rest ] = file.webkitRelativePath.split( '/' );
      folderName = top;
      rest.slice( 0, -1 ).forEach( ( name, i ) => entries.set( rest.slice( 0, i + 1 ).join( '/' ), { type: 'folder' } ) );
      entries.set( rest.join( '/' ), { type: 'file', size: file.size, getFile: async () => file } );
    }
    return Local.makeSource( folderName, entries );
  },

  // ── Which GitHub repo the folder is a clone of ──

  // The [remote "origin"] url (https or ssh, optional .git), else any GitHub url. null if none.
  parseGitConfig: ( text ) => {
    const origin = text.match( /\[remote "origin"\]([^[]*)/ );
    const match = ( origin ? origin[ 1 ] : text ).match( /url\s*=\s*\S*github\.com[:/]+([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?\s*$/im );
    return match ? { owner: match[ 1 ], repo: match[ 2 ] } : null;
  },

  // 'ref: refs/heads/main' → 'main'. A detached HEAD gives '' (the default branch).
  parseGitHead: ( text ) => ( text.trim().match( /^ref: refs\/heads\/(.+)$/ ) || [] )[ 1 ] || '',

  readGitRepo: async ( source ) => {
    try {
      const repo = Local.parseGitConfig( await source.readText( '.git/config' ) );
      const head = await source.readText( '.git/HEAD' ).catch( () => '' );
      return repo ? { ...repo, branch: Local.parseGitHead( head ) } : null;
    } catch ( error ) { return null; }
  },

  // ── Remembered per page path, in IndexedDB: { choice: 'local' | 'github', handle, folderName, gitRepo } ──

  // One IndexedDB call. Storage can be blocked, or never answer at all (headless Chrome on
  // file://), so each call gives up after 2 s: the panel still appears, just without memory.
  idb: ( mode, action ) => new Promise( ( resolve, reject ) => {
    setTimeout( () => reject( new Error( 'IndexedDB did not answer' ) ), 2000 );
    const open = indexedDB.open( 'tootoo', 1 );
    open.onupgradeneeded = () => open.result.createObjectStore( 'pages' );
    open.onerror = () => reject( open.error );
    open.onsuccess = () => {
      const db = open.result;
      const request = action( db.transaction( 'pages', mode ).objectStore( 'pages' ) );
      request.onsuccess = () => { db.close(); resolve( request.result ); };
      request.onerror = () => { db.close(); reject( request.error ); };
    };
  } ),

  db: {   // tests swap in an in-memory store
    get: ( key ) => Local.idb( 'readonly', ( store ) => store.get( key ) ),
    put: ( key, record ) => Local.idb( 'readwrite', ( store ) => store.put( record, key ) ),
  },

  // When storage fails, nothing is remembered, and nothing breaks.
  recall: ( key = location.pathname ) => Local.db.get( key ).catch( () => null ),
  remember: ( record, key = location.pathname ) => Local.db.put( key, record ).catch( () => null ),

  // ── The start panel ──

  // 'picker' where the browser has one, else 'upload'.
  pickMethod: ( win = window ) => typeof win.showDirectoryPicker === 'function' ? 'picker' : 'upload',

  button: ( label, onClick ) => {
    const button = document.createElement( 'button' );
    button.type = 'button';
    button.textContent = label;
    button.addEventListener( 'click', onClick );
    return button;
  },

  // Shows the panel in `element` and resolves to { choice: 'local', source } or
  // { choice: 'github', repo } (repo is null when the folder's .git/config gave none).
  showStartPanel: async ( element, win = window ) => {
    const saved = ( await Local.recall() ) || {};
    element.innerHTML = `<section class="start-panel">
      <h2>📂 Open this repo from disk?</h2>
      <p>Choose the folder to browse its files, including edits not yet pushed. Nothing is fetched from GitHub until you choose.</p>
      <div class="start-actions"></div>
      <p class="start-message" role="status"></p>
    </section>`;
    const actions = element.querySelector( '.start-actions' );
    const message = element.querySelector( '.start-message' );

    return new Promise( ( resolve ) => {
      const openLocal = async ( source, handle ) => {
        const gitRepo = await Local.readGitRepo( source );
        const record = handle ? { choice: 'local', handle, folderName: source.folderName, gitRepo }
          : { ...saved, choice: 'local', gitRepo: gitRepo || saved.gitRepo };
        await Local.remember( record );
        resolve( { choice: 'local', source } );
      };

      // The fallback: a label around the hidden input, so the click opens the browser's folder upload.
      const upload = document.createElement( 'label' );
      upload.className = 'button';
      upload.innerHTML = '📤 Choose folder (upload)<input type="file" webkitdirectory hidden>';
      upload.querySelector( 'input' ).addEventListener( 'change', ( event ) => {
        if ( event.target.files.length ) { openLocal( Local.fromFiles( event.target.files ) ); }
      } );

      const showUpload = ( text ) => {
        message.textContent = text;
        if ( ! upload.isConnected ) { actions.prepend( upload ); }
      };

      const reopen = Local.button( `📂 Reopen ${ saved.folderName }`, async () => {
        try {
          const handle = saved.handle;
          const allowed = ( await handle.queryPermission( { mode: 'read' } ) ) === 'granted'
            || ( await handle.requestPermission( { mode: 'read' } ) ) === 'granted';
          if ( ! allowed ) { message.textContent = 'Permission not given. Try again, or open another folder.'; return; }
          openLocal( await Local.fromHandle( handle ), handle );
        } catch ( error ) {
          message.textContent = `Couldn't reopen ${ saved.folderName } (${ error.message }). Open the folder again.`;
        }
      } );

      const pick = Local.button( '📂 Open folder', async () => {
        try {
          const handle = await win.showDirectoryPicker( { mode: 'read' } );
          message.textContent = `Reading ${ handle.name }…`;
          openLocal( await Local.fromHandle( handle ), handle );
        } catch ( error ) {
          // A cancel and a broken picker (Chrome 157) both throw AbortError, so offer the fallback either way.
          showUpload( 'No folder opened. Try again, or choose the folder with the upload button.' );
        }
      } );

      const repo = saved.gitRepo;
      const github = Local.button( repo ? `Browse ${ repo.owner }/${ repo.repo } on GitHub instead` : 'Browse GitHub instead', async () => {
        await Local.remember( { ...saved, choice: 'github' } );
        resolve( { choice: 'github', repo: repo || null } );
      } );

      const local = [ saved.handle && saved.folderName ? reopen : null, Local.pickMethod( win ) === 'picker' ? pick : upload ];
      const ordered = saved.choice === 'github' ? [ github, ...local ] : [ ...local, github ];
      actions.append( ...ordered.filter( Boolean ) );
      ordered.filter( Boolean )[ 0 ].classList.add( 'primary' );   // the remembered choice comes first
    } );
  },

};
</script>
<script>/* src/loaders/markdown.js */
// markdown.js: Markdown → safe HTML (marked, then DOMPurify; both load at startup).
// Headings get GitHub-style ids, for '#file#heading' links. Relative links open the
// file inside the app; relative images, video and audio load through the source.
// HTML wrapped in '<!--@@@ … @@@-->' shows only in TooToo; web-page iframes are allowed.

const MarkdownLoader = {

  extensions: [ 'md', 'markdown', 'mkd', 'mdown', 'mkdn' ],
  toggle: () => true,

  // 'Getting Started!' → 'getting-started', as GitHub does.
  slug: ( text ) => text.toLowerCase().trim().replace( /[^\p{L}\p{N}\s_-]/gu, '' ).replace( /\s/g, '-' ),

  // Repeated headings get -1, -2, … as on GitHub.
  addHeadingIds: ( box ) => {
    const used = new Map();
    for ( const heading of box.querySelectorAll( 'h1, h2, h3, h4, h5, h6' ) ) {
      const base = MarkdownLoader.slug( heading.textContent );
      const count = used.get( base ) || 0;
      used.set( base, count + 1 );
      heading.id = count ? `${ base }-${ count }` : base;
    }
  },

  // A link inside the repo → { path, heading } of the file it opens, or null.
  // A folder opens its README; '#heading' alone stays in this file.
  target: ( file, href ) => {
    const [ beforeHash, ...rest ] = href.split( '#' );
    const heading = Router.decode( rest.join( '#' ) );
    const pathPart = beforeHash.split( '?' )[ 0 ];
    if ( ! pathPart ) { return { path: file.path, heading }; }
    const path = Loaders.resolvePath( file.path, pathPart );
    const item = ( state.tree || [] ).find( ( entry ) => entry.path === path );
    const opens = item && ( item.type === 'folder' ? Tree.readmeIn( path ) : path );
    return opens ? { path: opens, heading } : null;
  },

  fixLinks: ( box, file ) => {
    for ( const link of box.querySelectorAll( 'a[href]' ) ) {
      const href = link.getAttribute( 'href' );
      if ( Loaders.isExternal( href ) ) {
        link.target = '_blank';
        link.rel = 'noopener';
      } else {
        const target = MarkdownLoader.target( file, href );
        const heading = target && target.heading ? `#${ encodeURIComponent( target.heading ) }` : '';
        if ( target ) { link.setAttribute( 'href', `#${ Router.encodePath( target.path ) }${ heading }` ); }
      }
    }
  },

  // Relative images, video and audio (and a <video>'s <source>) load through the source.
  fixMedia: ( box, file ) => Promise.all( [ ...box.querySelectorAll( 'img[src], video[src], audio[src], source[src]' ) ].map( async ( media ) => {
    const src = media.getAttribute( 'src' );
    if ( Loaders.isExternal( src ) ) { return; }
    const path = Loaders.resolvePath( file.path, src.split( /[?#]/ )[ 0 ] );
    try {
      media.src = await Loaders.urlFor( file.source, path );
    } catch ( error ) {
      media.removeAttribute( 'src' );
      if ( media.tagName === 'IMG' ) { media.alt = `${ media.alt } (not found: ${ path })`; }
    }
  } ) ),

  // '<!--@@@ … @@@-->' is a comment, so GitHub hides it; TooToo drops the markers and shows what's inside.
  unwrap: ( text ) => text.replace( /<!--@@@([\s\S]*?)@@@-->/g, '$1' ),

  // An <iframe> stays only when it loads a web page (http: or https:).
  fixFrames: ( box ) => box.querySelectorAll( 'iframe' ).forEach( ( frame ) => {
    if ( ! /^https?:\/\//i.test( frame.getAttribute( 'src' ) || '' ) ) { frame.remove(); }
  } ),

  render: async ( file, element ) => {
    // A <template> is inert: images don't start loading from the wrong place while links are fixed.
    const template = document.createElement( 'template' );
    const html = marked.parse( MarkdownLoader.unwrap( await file.source.readText( file.path ) ) );
    template.innerHTML = DOMPurify.sanitize( html, { ADD_TAGS: [ 'iframe' ], ADD_ATTR: [ 'allow', 'allowfullscreen' ] } );
    const box = template.content;
    MarkdownLoader.fixFrames( box );
    MarkdownLoader.addHeadingIds( box );
    MarkdownLoader.fixLinks( box, file );
    await MarkdownLoader.fixMedia( box, file );
    const blocks = box.querySelectorAll( 'pre code' );
    if ( blocks.length ) {
      await Loaders.loadLibraries( CodeLoader.library ).catch( () => {} );   // plain code blocks if it can't load
      blocks.forEach( ( block ) => CodeLoader.highlight( block, ( block.className.match( /language-(\S+)/ ) || [] )[ 1 ] || '' ) );
    }
    const article = document.createElement( 'div' );
    article.className = 'markdown-body';
    article.append( box );
    element.replaceChildren( article );
  },

};
</script>
<script>/* src/loaders/code.js */
// code.js: source code, highlighted by highlight.js (loaded the first time it's needed).
// Also the Raw view of Markdown, HTML, CSV and SVG. Colors come from styles.css, so they follow dark mode.

const CodeLoader = {

  extensions: [ 'js', 'mjs', 'cjs', 'ts', 'json', 'css', 'scss', 'less', 'py', 'rb', 'java', 'c', 'h', 'cpp', 'cs',
    'go', 'rs', 'php', 'sh', 'bash', 'ps1', 'bat', 'yml', 'yaml', 'toml', 'ini', 'xml', 'sql', 'lua', 'r', 'swift', 'kt',
    'pl', 'diff', 'graphql', 'gitignore', 'gitattributes', 'editorconfig' ],

  library: [ 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js' ],

  // File extension → highlight.js language, where the names differ.
  languages: { js: 'javascript', mjs: 'javascript', cjs: 'javascript', ts: 'typescript', py: 'python', rb: 'ruby',
    h: 'c', cs: 'csharp', rs: 'rust', sh: 'bash', ps1: 'powershell', bat: 'dos', yml: 'yaml', kt: 'kotlin', pl: 'perl',
    md: 'markdown', markdown: 'markdown', html: 'xml', htm: 'xml', svg: 'xml', toml: 'ini', csv: 'plaintext', tsv: 'plaintext' },

  // Colors the text of a <code> block, when highlight.js is loaded and knows the language.
  highlight: ( code, extOrLanguage ) => {
    const language = CodeLoader.languages[ extOrLanguage ] || extOrLanguage;
    if ( ! window.hljs || ! language || ! window.hljs.getLanguage( language ) ) { return; }
    code.innerHTML = window.hljs.highlight( code.textContent, { language, ignoreIllegals: true } ).value;
    code.classList.add( 'hljs' );
  },

  render: async ( file, element ) => {
    const pre = document.createElement( 'pre' );
    const code = document.createElement( 'code' );
    pre.className = 'code-view';
    code.textContent = await file.source.readText( file.path );
    CodeLoader.highlight( code, file.ext );
    pre.append( code );
    element.replaceChildren( pre );
  },

};
</script>
<script>/* src/loaders/media.js */
// media.js: images, SVG (with a Raw view of its source), audio and video.

const MediaLoader = {

  extensions: [ 'png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'bmp', 'ico', 'svg',
    'mp3', 'wav', 'ogg', 'm4a', 'flac', 'mp4', 'webm', 'ogv', 'mov' ],
  audio: [ 'mp3', 'wav', 'ogg', 'm4a', 'flac' ],
  video: [ 'mp4', 'webm', 'ogv', 'mov' ],

  toggle: ( ext ) => ext === 'svg',

  render: async ( file, element ) => {
    const url = await Loaders.urlFor( file.source, file.path );
    const tag = MediaLoader.audio.includes( file.ext ) ? 'audio' : MediaLoader.video.includes( file.ext ) ? 'video' : 'img';
    const media = document.createElement( tag );
    media.className = 'media-view';
    media.src = url;
    if ( tag === 'img' ) { media.alt = file.name; } else { media.controls = true; }
    element.replaceChildren( media );
  },

};
</script>

  render: async ( file, element ) => {
    const pre = document.createElement( 'pre' );

  extensions: [ 'pdf' ],

  render: async ( file, element ) => {
    const frame = document.createElement( 'iframe' );
    frame.className = 'pdf-view';

    frame.src = await Loaders.urlFor( file.source, file.path );
